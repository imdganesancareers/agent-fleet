# fleet.yaml — registry of record for the agents on this VM.
# Written only by the lifecycle scripts in scripts/ — never edit by hand.
# Fields per entry: name, status (active|retired), created, purpose, retired.
agents:
- name: aruvi-spec-reviewer
  status: active
  created: '2026-08-15'
  purpose: 'Reviews aruvii REQ-NNN specs against the architecture, ADRs, product design
    and roadmap — before /approved is posted on a draft MR — and pre-checks issue-resident
    stories (`type::story`) for mechanical completeness before their /approved gate.
    Findings only: it never drafts spec or story text, never approves. Reports land
    verbatim on the GitLab artifact (MR comment or issue comment) and as the same
    message in its Discord channel. Second duty, on operator request only: dockerize
    the platform from its clone, run it locally in rootless containers, verify it
    with a headless browser, and report — without ever writing to git or GitLab.'
- name: aruvii-analyst
  status: active
  created: '2026-08-16'
  purpose: 'Requirements analyst for the aruvii platform (the `agent-platform` repo).
    Owns the intake half of the delivery loop: Business Requirement → operator go-ahead
    → Engineering Requirement grilling in a Discord thread → decomposition into child
    story issues → per-story story + plan → the human `/approved` gate. Never writes
    application code, never implements, never approves.'
- name: aruvii-developer
  status: active
  created: '2026-08-16'
  purpose: Developer on the aruvii platform (the `agent-platform` repo). Implements
    human-approved stories test-first — one story, one branch, one MR — runs the full
    DoD gate locally, and hands the MR to qa. Story authoring, decomposition, and
    planning belong to the analyst; approval and merge belong to the humans.
- name: aruvii-qa
  status: active
  created: '2026-08-16'
  purpose: Reviewer and verifier for the aruvii platform. Reviews merge requests against
    their story's acceptance criteria, then independently verifies by building the
    app with docker from the MR branch, running the compose stack, and testing on
    localhost with Playwright — including new AC-mapped checks that grow the regression
    suite. Never merges, never approves, never fixes what it reviews.
